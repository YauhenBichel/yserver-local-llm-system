<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080d1c"/><stop offset="1" stop-color="#101a36"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#fff" opacity="0.05"/></pattern>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8f9fff"/></marker>
<marker id="arbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb7185"/></marker>
<marker id="arok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker></defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#dots)"/>
<text x="64" y="84" font-size="42" fill="#fff" font-weight="800">One request: from my tool to the model</text>
<text x="64" y="122" font-size="22" fill="#9fb0e6">Every request goes through the same seven steps. The gateway is the only entrance, and the model</text>
<text x="64" y="152" font-size="22" fill="#9fb0e6">handles one request at a time.</text>
<text x="1536" y="72" font-size="20" fill="#fff" font-weight="700" text-anchor="end">Yauhen Bichel</text><text x="1536" y="96" font-size="16" fill="#8fa3d9" text-anchor="end">github.com/YauhenBichel</text>
<rect x="64" y="200" width="350" height="190" rx="18" fill="#0f1830" stroke="#25345c" stroke-width="1.2"/>
<circle cx="102" cy="236" r="15" fill="url(#accent)"/><text x="102" y="243" font-size="18" font-weight="800" fill="#08101f" text-anchor="middle">1</text>
<text x="128" y="244" font-size="22" fill="#fff" font-weight="700" text-anchor="start">My tool sends a</text>
<text x="128" y="274" font-size="22" fill="#fff" font-weight="700" text-anchor="start">request</text>
<text x="88" y="320" font-size="18" fill="#b6c3ea" font-weight="400" text-anchor="start">It uses a model name it</text>
<text x="88" y="346" font-size="18" fill="#b6c3ea" font-weight="400" text-anchor="start">already knows.</text>
<rect x="438" y="200" width="350" height="190" rx="18" fill="#0f1830" stroke="#25345c" stroke-width="1.2"/>
<circle cx="476" cy="236" r="15" fill="url(#accent)"/><text x="476" y="243" font-size="18" font-weight="800" fill="#08101f" text-anchor="middle">2</text>
<text x="502" y="244" font-size="22" fill="#fff" font-weight="700" text-anchor="start">A secure tunnel</text>
<text x="462" y="290" font-size="18" fill="#b6c3ea" font-weight="400" text-anchor="start">Nothing is open to the</text>
<text x="462" y="316" font-size="18" fill="#b6c3ea" font-weight="400" text-anchor="start">network.</text>
<rect x="812" y="200" width="350" height="190" rx="18" fill="#0f1830" stroke="url(#accent)" stroke-width="2.5"/>
<circle cx="850" cy="236" r="15" fill="url(#accent)"/><text x="850" y="243" font-size="18" font-weight="800" fill="#08101f" text-anchor="middle">3</text>
<text x="876" y="244" font-size="22" fill="#fff" font-weight="700" text-anchor="start">Check access</text>
<text x="836" y="290" font-size="18" fill="#b6c3ea" font-weight="400" text-anchor="start">The gateway is the only</text>
<text x="836" y="316" font-size="18" fill="#b6c3ea" font-weight="400" text-anchor="start">entrance.</text>
<rect x="1186" y="200" width="350" height="190" rx="18" fill="#0f1830" stroke="url(#accent)" stroke-width="2.5"/>
<circle cx="1224" cy="236" r="15" fill="url(#accent)"/><text x="1224" y="243" font-size="18" font-weight="800" fill="#08101f" text-anchor="middle">4</text>
<text x="1250" y="244" font-size="22" fill="#fff" font-weight="700" text-anchor="start">Choose the model</text>
<text x="1210" y="290" font-size="18" fill="#b6c3ea" font-weight="400" text-anchor="start">name, then role, then local</text>
<text x="1210" y="316" font-size="18" fill="#b6c3ea" font-weight="400" text-anchor="start">model</text>
<rect x="1186" y="450" width="350" height="190" rx="18" fill="#0f1830" stroke="url(#accent)" stroke-width="2.5"/>
<circle cx="1224" cy="486" r="15" fill="url(#accent)"/><text x="1224" y="493" font-size="18" font-weight="800" fill="#08101f" text-anchor="middle">5</text>
<text x="1250" y="494" font-size="22" fill="#fff" font-weight="700" text-anchor="start">Check the length</text>
<text x="1210" y="540" font-size="18" fill="#b6c3ea" font-weight="400" text-anchor="start">Too long? An error, never a</text>
<text x="1210" y="566" font-size="18" fill="#b6c3ea" font-weight="400" text-anchor="start">cut.</text>
<rect x="812" y="450" width="350" height="190" rx="18" fill="#0f1830" stroke="url(#accent)" stroke-width="2.5"/>
<circle cx="850" cy="486" r="15" fill="url(#accent)"/><text x="850" y="493" font-size="18" font-weight="800" fill="#08101f" text-anchor="middle">6</text>
<text x="876" y="494" font-size="22" fill="#fff" font-weight="700" text-anchor="start">Wait in the queue</text>
<text x="836" y="540" font-size="18" fill="#b6c3ea" font-weight="400" text-anchor="start">One request at a time. The</text>
<text x="836" y="566" font-size="18" fill="#b6c3ea" font-weight="400" text-anchor="start">wait is visible.</text>
<rect x="438" y="450" width="350" height="190" rx="18" fill="#0f1830" stroke="#34d399" stroke-width="2.5"/>
<circle cx="476" cy="486" r="15" fill="url(#accent)"/><text x="476" y="493" font-size="18" font-weight="800" fill="#08101f" text-anchor="middle">7</text>
<text x="502" y="494" font-size="22" fill="#fff" font-weight="700" text-anchor="start">The model answers</text>
<text x="462" y="540" font-size="18" fill="#b6c3ea" font-weight="400" text-anchor="start">on the built-in GPU, word by</text>
<text x="462" y="566" font-size="18" fill="#b6c3ea" font-weight="400" text-anchor="start">word</text>
<path d="M420 295 L432 295" stroke="#8f9fff" stroke-width="3" fill="none" marker-end="url(#ar)"/>
<path d="M794 295 L806 295" stroke="#8f9fff" stroke-width="3" fill="none" marker-end="url(#ar)"/>
<path d="M1168 295 L1180 295" stroke="#8f9fff" stroke-width="3" fill="none" marker-end="url(#ar)"/>
<path d="M1361 396 L1361 444" stroke="#8f9fff" stroke-width="3" fill="none" marker-end="url(#ar)"/>
<path d="M1180 545 L1168 545" stroke="#8f9fff" stroke-width="3" fill="none" marker-end="url(#ar)"/>
<path d="M806 545 L794 545" stroke="#8f9fff" stroke-width="3" fill="none" marker-end="url(#ar)"/>
<rect x="64" y="450" width="350" height="190" rx="18" fill="#0f1830" stroke="#34d399" stroke-width="2.5"/>
<rect x="88" y="470" width="30" height="5" rx="2.5" fill="#34d399"/>
<text x="88" y="506" font-size="22" fill="#fff" font-weight="700" text-anchor="start">The answer returns</text>
<text x="88" y="552" font-size="18" fill="#b6c3ea" font-weight="400" text-anchor="start">with the name of the model</text>
<text x="88" y="578" font-size="18" fill="#b6c3ea" font-weight="400" text-anchor="start">that really answered</text>
<path d="M432 545 L420 545" stroke="#34d399" stroke-width="3" fill="none" marker-end="url(#arok)"/>
<text x="812" y="186" font-size="16" fill="#5eead4" font-weight="600" letter-spacing="1.6" text-anchor="start">STEPS 3 TO 6: INSIDE MY GATEWAY</text>
<rect x="64" y="664" width="1472" height="130" rx="18" fill="#0f1830" stroke="#25345c" stroke-width="1.2"/>
<rect x="88" y="684" width="30" height="5" rx="2.5" fill="#60a5fa"/>
<text x="88" y="720" font-size="22" fill="#fff" font-weight="700" text-anchor="start">What the gateway writes down</text>
<text x="88" y="766" font-size="18" fill="#b6c3ea" font-weight="400" text-anchor="start">Sizes, times and the model. Never the text of a prompt.</text>
<line x1="64" y1="806" x2="1536" y2="806" stroke="#25345c"/>
<text x="64" y="852" font-size="23" fill="#fff" font-weight="700">One protected entrance, and everything else is closed.</text>
</svg>
